<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JDL Study">
<title>Japan Driver's License Study Guide — Karimen &amp; Honmen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231A50A2'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#faf8f3;
  --paper-2:#f1ede4;
  --ink:#1d1d1f;
  --ink-soft:#55554f;
  --blue:#1A50A2;        /* regulatory instruction-sign blue */
  --blue-soft:#e7eef9;
  --red:#C0272D;         /* regulatory sign red */
  --red-soft:#faeaea;
  --green:#0e7a5f;       /* maru ○ */
  --green-soft:#e4f2ec;
  --amber:#9a6b00;
  --amber-soft:#f7efd8;
  --line:#d8d2c4;
  --line-strong:#a9a294;
  --topbar-h:48px;
  --sidebar-w:264px;
  --radius:8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{line-height:1.3;margin:1.4em 0 .5em}
h1{font-size:1.55rem}
h2{font-size:1.25rem;border-bottom:2px solid var(--blue);padding-bottom:.25em}
h3{font-size:1.05rem}
p{margin:.6em 0}
a{color:var(--blue)}
ul,ol{padding-left:1.4em}
li{margin:.25em 0}
strong{font-weight:650}
hr{border:none;border-top:1px solid var(--line);margin:1.5em 0}
code{background:var(--paper-2);padding:0 4px;border:1px solid var(--line);font-size:.9em}

/* ============ LAYOUT ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:calc(var(--topbar-h) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  background:var(--blue);color:#fff;
  display:flex;align-items:center;gap:10px;
  z-index:40;
  padding-left:10px;padding-right:10px;
}
.topbar .title{font-weight:650;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{
  background:none;border:1px solid rgba(255,255,255,.45);border-radius:6px;
  color:#fff;font-size:1.05rem;line-height:1;
  width:38px;height:34px;flex:0 0 auto;cursor:pointer;
}
.backdrop{
  position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:48;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
body.drawer-open .backdrop{opacity:1;pointer-events:auto}

nav#toc{
  position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(82vw,300px);
  background:#fff;border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .22s ease;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(10px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom));
}
body.drawer-open nav#toc{transform:translateX(0)}
nav#toc .nav-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 14px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;
}
nav#toc .nav-head .t{font-weight:700;color:var(--blue)}
nav#toc .close-btn{background:none;border:none;font-size:1.4rem;color:var(--ink-soft);cursor:pointer;padding:4px 8px}
nav#toc a{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;color:var(--ink);text-decoration:none;font-size:.95rem;
  border-left:3px solid transparent;
}
nav#toc a.sub{padding-left:30px;font-size:.9rem;color:var(--ink-soft)}
nav#toc a[aria-current="page"]{
  background:var(--blue-soft);border-left-color:var(--blue);color:var(--blue);font-weight:650;
}
nav#toc .group-label{
  font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);padding:14px 14px 4px;
}
nav#toc a .nbadge{margin-left:auto;flex:0 0 auto}

main{
  padding:calc(var(--topbar-h) + env(safe-area-inset-top) + 8px) 16px calc(40px + env(safe-area-inset-bottom));
  max-width:74ch;
}
section[data-route]{display:block}
section[hidden]{display:none}

@media (min-width:880px){
  .topbar{display:none}
  .backdrop{display:none}
  nav#toc{
    transform:none;width:var(--sidebar-w);
    background:transparent;border-right:1px solid var(--line);
    padding-top:18px;
  }
  nav#toc .close-btn{display:none}
  main{margin-left:var(--sidebar-w);padding-top:24px;padding-left:36px;padding-right:36px}
}

/* ============ COMPONENTS ============ */
.badge{
  display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;
  padding:1px 7px;border:1px solid currentColor;border-radius:3px;vertical-align:2px;
}
.badge.high{color:var(--red)}
.badge.med{color:var(--amber)}
.badge.skim{color:var(--ink-soft)}
.badge.stage{color:var(--blue)}
.badge.trap{color:#fff;background:var(--red);border-color:var(--red)}

.chapter-tab{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:30px;height:30px;background:var(--blue);color:#fff;
  font-weight:700;font-size:1rem;margin-right:10px;padding:0 6px;
}

.card{
  background:#fff;border:1px solid var(--line);padding:14px 16px;margin:12px 0;
}
.card.accent{border-left:4px solid var(--blue)}
.card.warn{border-left:4px solid var(--red);background:var(--red-soft)}
.card.ok{border-left:4px solid var(--green);background:var(--green-soft)}

.callout{
  border:1px solid var(--line-strong);background:var(--paper-2);
  padding:10px 14px;margin:14px 0;font-size:.95rem;
}
.callout .lbl{font-weight:700;color:var(--blue);display:block;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}

table{border-collapse:collapse;width:100%;margin:14px 0;background:#fff;font-size:.93rem}
th,td{border:1px solid var(--line-strong);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--blue-soft);color:var(--ink);font-weight:650}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0}
.table-wrap table{margin:0;min-width:480px}
td .num,th .num,.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--red)}

.btn{
  display:inline-block;border:1px solid var(--blue);background:var(--blue);color:#fff;
  font-size:.95rem;font-weight:600;padding:9px 16px;border-radius:var(--radius);
  cursor:pointer;text-decoration:none;text-align:center;
}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:#fff;color:var(--blue)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink-soft)}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn.small{font-size:.83rem;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}

/* quiz */
.quiz-shell{max-width:62ch}
.quiz-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft);margin-bottom:8px}
.quiz-progressbar{height:5px;background:var(--paper-2);border:1px solid var(--line);margin-bottom:16px}
.quiz-progressbar > div{height:100%;background:var(--blue)}
.timer-chip{
  margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;
  border:1px solid var(--line-strong);padding:2px 9px;background:#fff;
}
.timer-chip.low{color:var(--red);border-color:var(--red)}
.q-statement{
  background:#fff;border:1px solid var(--line-strong);padding:18px 18px;
  font-size:1.08rem;min-height:7em;display:flex;align-items:center;
}
.ox-bar{
  display:flex;gap:12px;margin-top:18px;
}
.ox-bar button{
  flex:1;font-size:2rem;font-weight:700;padding:12px 0;min-height:60px;
  border-radius:var(--radius);cursor:pointer;border-width:2px;border-style:solid;
}
.ox-bar .o-btn{border-color:var(--green);color:var(--green);background:#fff}
.ox-bar .x-btn{border-color:var(--red);color:var(--red);background:#fff}
.ox-bar .o-btn.picked{background:var(--green);color:#fff}
.ox-bar .x-btn.picked{background:var(--red);color:#fff}
.ox-bar button:disabled{opacity:.55}
.ox-hint{font-size:.78rem;color:var(--ink-soft);text-align:center;margin-top:6px}
@media (max-width:879px){
  .ox-hint{display:none}
  body.quiz-active .ox-sticky{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--paper);border-top:1px solid var(--line-strong);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    margin:0;
  }
  body.quiz-active main{padding-bottom:140px}
}
.verdict{font-weight:700;font-size:1.05rem;margin:14px 0 6px}
.verdict.correct{color:var(--green)}
.verdict.wrong{color:var(--red)}
.explain{border:1px solid var(--line-strong);background:#fff;border-left:4px solid var(--blue);padding:12px 14px;margin:10px 0;font-size:.95rem}
.explain .trap-tag{margin-bottom:6px}

.result-score{font-size:2rem;font-weight:800;margin:.2em 0}
.passline{position:relative;height:26px;background:var(--paper-2);border:1px solid var(--line-strong);margin:14px 0 22px}
.passline .fill{position:absolute;top:0;bottom:0;left:0;background:var(--blue-soft);border-right:3px solid var(--blue)}
.passline .fill.pass{background:var(--green-soft);border-right-color:var(--green)}
.passline .mark{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--red)}
.passline .mark span{position:absolute;top:-18px;left:-18px;font-size:.72rem;color:var(--red);white-space:nowrap}
.minibar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.88rem}
.minibar .track{flex:1;height:10px;background:var(--paper-2);border:1px solid var(--line)}
.minibar .track i{display:block;height:100%;background:var(--green)}
.minibar.weak .track i{background:var(--red)}
.minibar .pct{width:46px;text-align:right;font-variant-numeric:tabular-nums}
.minibar .nm{width:max(34%,130px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.review-item{border:1px solid var(--line);background:#fff;padding:10px 14px;margin:8px 0;font-size:.93rem}
.review-item .ri-head{display:flex;gap:8px;align-items:baseline}
.review-item.wrong{border-left:4px solid var(--red)}
.review-item.right{border-left:4px solid var(--green)}

/* dashboard */
.ladder{margin:16px 0;padding:0;list-style:none}
.ladder li{
  display:flex;gap:12px;align-items:flex-start;padding:7px 0 7px 0;
  color:var(--ink-soft);font-size:.93rem;
}
.ladder .dot{
  flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);
  background:#fff;text-align:center;line-height:19px;font-size:.72rem;font-weight:700;
}
.ladder li.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.ladder li.current{color:var(--ink);font-weight:650}
.ladder li.current .dot{border-color:var(--blue);color:var(--blue)}
.next-step{border:1px solid var(--blue);background:var(--blue-soft);padding:10px 14px;font-size:.95rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat-grid .cell{background:#fff;border:1px solid var(--line);padding:10px 12px}
.stat-grid .cell .v{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat-grid .cell .k{font-size:.78rem;color:var(--ink-soft)}
.sparkline{width:100%;height:70px;background:#fff;border:1px solid var(--line)}

/* anchors flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:14px 0}
.flip{
  border:1px solid var(--line-strong);background:#fff;padding:10px 12px;cursor:pointer;
  min-height:88px;font-size:.9rem;
}
.flip .fq{color:var(--ink)}
.flip .fa{display:none;margin-top:6px;font-weight:700;color:var(--blue);border-top:1px dashed var(--line);padding-top:6px}
.flip.revealed .fa{display:block}
.flip .tap{font-size:.72rem;color:var(--ink-soft);margin-top:6px}
.flip.revealed .tap{display:none}

/* quiz picker cards */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:14px 0}
.mode-card{background:#fff;border:1px solid var(--line-strong);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mode-card h3{margin:0;font-size:1rem}
.mode-card .desc{font-size:.85rem;color:var(--ink-soft);flex:1}
.mode-card .last{font-size:.78rem;color:var(--ink-soft)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--radius);
  font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;
}
.toast.show{opacity:1}
.banner{
  border:1px solid var(--amber);background:var(--amber-soft);color:var(--ink);
  padding:9px 14px;font-size:.88rem;margin:0 0 14px;
}

textarea.io{
  width:100%;min-height:110px;font-size:16px;font-family:ui-monospace,Menlo,monospace;
  border:1px solid var(--line-strong);padding:8px;background:#fff;
}

.sign-figure{display:inline-block;text-align:center;margin:6px 10px 6px 0;vertical-align:top;width:96px;font-size:.74rem;color:var(--ink-soft)}
.sign-figure svg{display:block;margin:0 auto 4px}

/* figures & infographics */
.figure{background:#fff;border:1px solid var(--line-strong);padding:12px 12px 8px;margin:16px 0}
.figure svg{display:block;width:100%;height:auto}
.figure .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.figure .scrollx svg{min-width:560px}
.figure .cap{font-size:.8rem;color:var(--ink-soft);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.fig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.fig-grid .fig-panel{background:#fff;border:1px solid var(--line-strong);padding:8px}
.fig-grid .fig-panel svg{display:block;width:100%;height:auto}
.fig-grid .fig-panel .pl{font-size:.78rem;color:var(--ink);margin-top:6px;text-align:center}
.fig-grid .fig-panel .pl .stepn{display:inline-block;background:var(--blue);color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:.7rem;font-weight:700;margin-right:5px}
.sign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:14px 0}
.sign-grid .sign-figure{width:auto;margin:0;background:#fff;border:1px solid var(--line);padding:8px 4px 6px}

.foot-note{font-size:.8rem;color:var(--ink-soft);border-top:1px solid var(--line);margin-top:36px;padding-top:10px}

/* ============ PRINT ============ */
@media print{
  .topbar,nav#toc,.backdrop,.btn,.btn-row,.toast,.ox-bar,.ox-hint{display:none !important}
  main{margin:0;padding:0;max-width:none}
  section[hidden]{display:block !important}
  section[data-route="quiz"],section[data-route="progress"],section[data-route="home"]{display:none !important}
  body{background:#fff}
  .card,.q-statement,.figure,.fig-panel{break-inside:avoid}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Open table of contents">☰</button>
  <div class="title">JP Driver's License Study Guide</div>
</header>

<div class="backdrop" id="backdrop"></div>

<nav id="toc" aria-label="Table of contents">
  <div class="nav-head">
    <span class="t">Contents</span>
    <button class="close-btn" id="closeNav" aria-label="Close menu">×</button>
  </div>
  <div id="navLinks"><!-- built by JS from ROUTES --></div>
</nav>

<main id="main">
  <section data-route="home"><div id="homeRoot"></div></section>
  <section data-route="exams" hidden><div id="examsRoot"></div></section>
  <section data-route="study" hidden><div id="studyIndexRoot"></div></section>

  <section data-route="study/ch3" hidden><div id="ch3Root"></div></section>
  <section data-route="study/ch4" hidden><div id="ch4Root"></div></section>
  <section data-route="study/ch5" hidden><div id="ch5Root"></div></section>
  <section data-route="study/ch6" hidden><div id="ch6Root"></div></section>
  <section data-route="study/ch79" hidden><div id="ch79Root"></div></section>
  <section data-route="anchors" hidden><div id="anchorsRoot"></div></section>
  <section data-route="traps" hidden><div id="trapsRoot"></div></section>

  <section data-route="hazard" hidden><div id="hazardRoot"></div></section>
  <section data-route="progress" hidden><div id="progressRoot"></div></section>
</main>

<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="svgDefs">
    <!-- shared glyphs -->
    <g id="hz-you"><rect x="-11" y="-20" width="22" height="40" rx="4" fill="#1A50A2"/><rect x="-8" y="-14" width="16" height="9" rx="2" fill="#9db9e8"/><text y="34" text-anchor="middle" font-size="11" fill="#1A50A2" font-weight="bold">you</text></g>
    <g id="hz-car"><rect x="-11" y="-20" width="22" height="40" rx="4" fill="#777"/><rect x="-8" y="-14" width="16" height="9" rx="2" fill="#ccc"/></g>
    <g id="hz-truck"><rect x="-13" y="-26" width="26" height="52" rx="3" fill="#4a4a42"/><rect x="-10" y="-22" width="20" height="14" rx="2" fill="#8a8a80"/></g>
    <g id="hz-ped"><circle r="4" fill="#C0272D"/><line x1="0" y1="4" x2="0" y2="13" stroke="#C0272D" stroke-width="2.6"/><line x1="-5" y1="8" x2="5" y2="8" stroke="#C0272D" stroke-width="2.4"/><line x1="0" y1="13" x2="-4" y2="20" stroke="#C0272D" stroke-width="2.4"/><line x1="0" y1="13" x2="4" y2="20" stroke="#C0272D" stroke-width="2.4"/></g>
    <g id="hz-bike"><circle cx="-6" cy="6" r="5" fill="none" stroke="#C0272D" stroke-width="2"/><circle cx="6" cy="6" r="5" fill="none" stroke="#C0272D" stroke-width="2"/><line x1="-6" y1="6" x2="0" y2="-4" stroke="#C0272D" stroke-width="2"/><line x1="0" y1="-4" x2="6" y2="6" stroke="#C0272D" stroke-width="2"/><circle cx="0" cy="-8" r="3" fill="#C0272D"/></g>

    <!-- scene 1: blind uncontrolled intersection, parked truck hides a cyclist -->
    <symbol id="haz-scene-1" viewBox="0 0 400 240">
      <rect width="400" height="240" fill="#e9e4d8"/>
      <rect x="165" y="0" width="70" height="240" fill="#b0aca0"/>
      <rect x="0" y="85" width="400" height="70" fill="#b0aca0"/>
      <line x1="200" y1="0" x2="200" y2="85" stroke="#fff" stroke-dasharray="10,8" stroke-width="2"/>
      <line x1="200" y1="155" x2="200" y2="240" stroke="#fff" stroke-dasharray="10,8" stroke-width="2"/>

      <text x="60" y="158" text-anchor="middle" font-size="11" fill="#C0272D" font-weight="bold">bicycle →</text>
      <use href="#hz-you" x="200" y="205"/>
      <path d="M200 178 L200 150" stroke="#1A50A2" stroke-width="3" marker-end="none"/>
      <polygon points="200,142 194,154 206,154" fill="#1A50A2"/>
    </symbol>

    <!-- scene 2: right turn, oncoming car with motorcycle behind it -->
    <symbol id="haz-scene-2" viewBox="0 0 400 240">
      <rect width="400" height="240" fill="#e9e4d8"/>
      <rect x="160" y="0" width="80" height="240" fill="#b0aca0"/>
      <rect x="160" y="85" width="240" height="70" fill="#b0aca0"/>
      <line x1="200" y1="0" x2="200" y2="240" stroke="#fff" stroke-dasharray="10,8" stroke-width="2"/>
      <line x1="240" y1="120" x2="400" y2="120" stroke="#fff" stroke-dasharray="10,8" stroke-width="2"/>
      <use href="#hz-car" x="219" y="40"/>
      <text x="262" y="36" font-size="11" fill="#555" font-weight="bold">oncoming car ↓</text>
      <use href="#hz-bike" x="219" y="14"/>

/* ===== 04 STORAGE ===== */
var Store = (function(){
  var KEY = 'jdlGuide.v1';
  var memoryOnly = false;
  var saveTimer = null;
  function fresh(){
    return {v:1, sections:{}, q:{}, history:[], wrongQueue:[], anchors:{}, settings:{timer:true}};
  }
  var state = fresh();
  function load(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); }
    catch(e){ memoryOnly = true; banner('Storage is unavailable in this browser mode — progress will not be saved.'); return; }
    if (!raw) return;
    try {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.v === 1) { state = Object.assign(fresh(), parsed); }
      else {
        try { localStorage.setItem(KEY + '.backup', raw); } catch(e2){}
        banner('Saved progress was from an unknown version and has been reset (a backup copy was kept).');
      }
    } catch(e){
      banner('Saved progress was unreadable and has been reset.');
    }
  }
  function persist(){
    if (memoryOnly) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch(e){
      // quota: trim history and retry once
      state.history = state.history.slice(-10);
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch(e2){
        memoryOnly = true;
        banner('Could not save progress (storage full or blocked). Running without saving.');
      }
    }
  }
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }
  function exportJSON(){ return JSON.stringify(state); }
  function importJSON(text){
    var parsed = JSON.parse(text); // caller catches
    if (!parsed || parsed.v !== 1) throw new Error('Not a valid progress export (missing v:1).');
    state = Object.assign(fresh(), parsed);
    persist();
  }
  function reset(){
    state = fresh();
    if (!memoryOnly) { try { localStorage.removeItem(KEY); } catch(e){} }
    persist();
  }
  return { get state(){ return state; }, load:load, save:save, exportJSON:exportJSON, importJSON:importJSON, reset:reset };
})();

/* ===== 05 ROUTER + NAV ===== */
var sections = {};
document.querySelectorAll('section[data-route]').forEach(function(s){ sections[s.dataset.route] = s; });

function currentRoute(){
  var h = location.hash.replace(/^#\/?/, '');
  return h || 'home';
}
function navigate(route){ location.hash = '#/' + route; }

var renderers = {}; // route -> render fn, registered by components

function dispatch(){
  var r = currentRoute();
  var params = null;
  if (!sections[r]) {
    // routes with params e.g. quiz/drill/parking
    var parts = r.split('/');
    if (parts[0] === 'quiz' && parts.length > 1) { params = parts.slice(1); r = 'quiz'; }
    else if (!sections[parts[0]]) { r = 'home'; }
    else r = parts[0];
  }
  if (Quiz.active && r !== 'quiz') {
    if (!confirm('A quiz is in progress. Leave and abandon it?')) {
      history.back();
      return;
    }
    Quiz.abandon();
  }
  Object.keys(sections).forEach(function(k){ sections[k].hidden = (k !== r); });
  document.querySelectorAll('#navLinks a').forEach(function(a){
    if (a.dataset.route === r) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  closeDrawer();
  if (renderers[r]) renderers[r](params);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', dispatch);

function buildNav(){
  var html = '';
  ROUTES.forEach(function(it){
    if (it.group) { html += '<div class="group-label">' + it.group + '</div>'; return; }
    var badge = it.yield ? '<span class="nbadge badge ' + it.yield + '">' + it.yield.toUpperCase() + '</span>' : '';
    html += '<a href="#/' + it.route + '" data-route="' + it.route + '" class="' + (it.sub ? 'sub' : '') + '">' + it.title + badge + '</a>';
  });
  document.getElementById('navLinks').innerHTML = html;
}

/* drawer */
function openDrawer(){ document.body.classList.add('drawer-open'); }
function closeDrawer(){ document.body.classList.remove('drawer-open'); }
document.getElementById('menuBtn').addEventListener('click', openDrawer);
document.getElementById('closeNav').addEventListener('click', closeDrawer);
document.getElementById('backdrop').addEventListener('click', closeDrawer);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDrawer(); });

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function banner(msg){
  var b = document.createElement('div');
  b.className = 'banner';
  b.textContent = msg;
  var main = document.getElementById('main');
  main.insertBefore(b, main.firstChild);
}

/* helpers */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ===== 06 COMPONENTS ===== */

/* --- readiness model --- */
var CHAPTERS = ['ch1','ch2','ch3','ch4','ch5','ch6','ch79'];
function topicAccuracy(){
  // topic -> {a, c, pct} aggregated from per-question stats
  var agg = {};
  QUESTIONS.forEach(function(q){
    var s = qstat(q.id);
    if (!s.a) return;
    if (!agg[q.topic]) agg[q.topic] = {a:0,c:0};
    agg[q.topic].a += s.a; agg[q.topic].c += s.c;
  });
  Object.keys(agg).forEach(function(t){ agg[t].pct = Math.round(agg[t].c/agg[t].a*100); });
  return agg;
}
function mocksOf(){
  return Store.state.history.filter(function(h){ return h.mode==='karimen'||h.mode==='honmen'||h.mode==='honmenFull'; });
}
function lastN(arr, mode, n){
  var f = arr.filter(function(h){ return mode.indexOf(h.mode) !== -1; });
  return f.slice(-n);
}
function readiness(){
  var s1 = QUESTIONS.filter(function(q){ return q.stage===1; });
  var attempted1 = s1.filter(function(q){ return qstat(q.id).a > 0; }).length;
  var attemptedPct = s1.length ? attempted1/s1.length : 0;
  var mocks = mocksOf();
  var best = mocks.reduce(function(m,h){ return Math.max(m, h.pct); }, 0);
  var acc = topicAccuracy();
  var weak = Object.keys(acc).filter(function(t){ return acc[t].a >= 5 && acc[t].pct < 80; });
  var lastK2 = lastN(Store.state.history, ['karimen'], 2);
  var k2ok = lastK2.length === 2 && lastK2.every(function(h){ return h.pct >= 90; });
  var lastH2 = lastN(Store.state.history, ['honmen','honmenFull'], 2);
  var h2ok = lastH2.length === 2 && lastH2.every(function(h){ return h.pct >= 90; });
  var chDone = CHAPTERS.filter(function(c){ return Store.state.sections[c] && Store.state.sections[c].done; }).length;

  var level, next;
  if (h2ok && k2ok && !weak.length) { level = 5; next = 'You meet the honmen-ready bar. Confirm with an external question bank, then book the test.'; }
  else if (k2ok && !weak.length) {
    level = 4;
    var hLast = lastH2.length ? lastH2[lastH2.length-1] : null;
    next = lastH2.length < 2
      ? 'Take ' + (2 - lastH2.length) + ' more honmen set(s) at ≥90% to reach honmen-ready.'
      : 'Your last honmen sets: ' + lastH2.map(function(h){return h.pct + '%';}).join(', ') + ' — get two in a row at ≥90%.';
    if (hLast && hLast.pct >= 90) next = 'One more honmen set at ≥90% (last was ' + hLast.pct + '%).';
  }
  else if (mocks.length && mocks[mocks.length-1].pct >= 90) {
    level = 3;
    next = weak.length
      ? 'Fix weak topic(s): ' + weak.map(function(t){ return TOPICS[t].label; }).join(', ') + ' — each must reach 80%.'
      : 'Take one more karimen mock at ≥90% to confirm consistency (last was ' + mocks[mocks.length-1].pct + '%).';
  }
  else if (mocks.length) {
    level = 2;
    var last = mocks[mocks.length-1];
    next = 'Best mock so far: ' + best + '%. Drill weak topics, then retake — you need ≥90%' + (last.pct ? ' (last was ' + last.pct + '%)' : '') + '.';
  }
  else if (attemptedPct >= 0.2 || chDone > 0) { level = 1; next = 'Work through the chapters and drills, then take your first karimen mock.'; }
  else { level = 0; next = 'Start with “How the Exams Work”, then Chapter 1. Drill as you go — reading alone does not pass this test.'; }
  return {level:level, next:next, weak:weak, acc:acc, mocks:mocks, attemptedPct:attemptedPct, chDone:chDone};
}

var LADDER = [
  'Getting started',
  'Studying the chapters',
  'Drilling — below the 90% bar',
  'Almost there — hit 90% once',
  'Karimen-ready (two mocks ≥90%, no weak topics)',
  'Honmen-ready (plus two honmen sets ≥90%)'
];

renderers['home'] = function(){
  var r = readiness();
  var root = document.getElementById('homeRoot');
  var ladderHtml = LADDER.map(function(lbl, i){
    var cls = i < r.level ? 'done' : (i === r.level ? 'current' : '');
    return '<li class="' + cls + '"><span class="dot">' + (i < r.level ? '✓' : i) + '</span><span>' + lbl + '</span></li>';
  }).join('');

  var attempted = QUESTIONS.filter(function(q){ return qstat(q.id).a > 0; }).length;
  var totA = 0, totC = 0;
  Object.keys(r.acc).forEach(function(t){ totA += r.acc[t].a; totC += r.acc[t].c; });
  var overallPct = totA ? Math.round(totC/totA*100) : 0;
  var wq = Store.state.wrongQueue.length;

  var weakHtml = r.weak.length
    ? r.weak.map(function(t){ return minibarRow(TOPICS[t].label, [r.acc[t].c, r.acc[t].a], '#/quiz/drill/' + t); }).join('')
    : (totA ? '<p style="color:var(--green);font-weight:600">No weak topics right now (everything attempted ≥5 times is at 80%+).</p>'
            : '<p style="color:var(--ink-soft)">Answer some questions and weak topics will surface here.</p>');

  /* sparkline of last 10 mocks */
  var hs = r.mocks.slice(-10);
  var spark = '';
  if (hs.length) {
    var W = 560, H = 70, pad = 8;
    var pts = hs.map(function(h, i){
      var x = hs.length === 1 ? W/2 : pad + i * ((W - 2*pad) / (hs.length - 1));
      var y = H - pad - (h.pct/100) * (H - 2*pad);
      return [x,y,h.pct];
    });
    var y90 = H - pad - 0.9 * (H - 2*pad);
    spark = '<svg class="sparkline" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<line x1="0" y1="' + y90 + '" x2="' + W + '" y2="' + y90 + '" stroke="#C0272D" stroke-dasharray="5,4" stroke-width="1.5"/>' +
      (pts.length > 1 ? '<polyline fill="none" stroke="#1A50A2" stroke-width="2.5" points="' + pts.map(function(p){ return p[0]+','+p[1]; }).join(' ') + '"/>' : '') +
      pts.map(function(p){ return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + (p[2]>=90?'#0e7a5f':'#C0272D') + '"/>'; }).join('') +
      '</svg><div style="font-size:.75rem;color:var(--ink-soft)">Last ' + hs.length + ' mock(s) — dashed line is the 90% pass bar. ' +
      hs.map(function(h){ return h.pct + '%'; }).join(' · ') + '</div>';
  }

  var nudge = wq > 15 ? '<div class="card warn"><strong>' + wq + ' questions in your review queue.</strong> Clear it before taking another mock — re-meeting your mistakes is the fastest score gain.</div>' : '';

  root.innerHTML =
    '<h1>Dashboard</h1>' +
    '<div class="next-step"><strong>Next step:</strong> ' + esc(r.next) + '</div>' +
    nudge +
    '<ul class="ladder">' + ladderHtml + '</ul>' +
    '<div class="stat-grid">' +
      '<div class="cell"><div class="v">' + attempted + '<span style="font-size:.85rem;color:var(--ink-soft)">/' + QUESTIONS.length + '</span></div><div class="k">questions attempted</div></div>' +
      '<div class="cell"><div class="v">' + (totA ? overallPct + '%' : '—') + '</div><div class="k">overall accuracy</div></div>' +
      '<div class="cell"><div class="v">' + wq + '</div><div class="k">in review queue</div></div>' +
      '<div class="cell"><div class="v">' + r.mocks.length + '</div><div class="k">mocks taken</div></div>' +
    '</div>' +
    (spark ? '<h2>Mock history</h2>' + spark : '') +
    '<h2>Weak topics</h2>' + weakHtml +
    '<h2>Continue</h2><div class="btn-row">' +
      (wq ? '<a class="btn" href="#/quiz/mode/review">Clear review queue (' + wq + ')</a>' : '') +
      '<a class="btn' + (wq ? ' secondary' : '') + '" href="#/quiz">Quiz Center</a>' +
      '<a class="btn secondary" href="#/study">Chapters (' + r.chDone + '/' + CHAPTERS.length + ' done)</a>' +
      '<a class="btn ghost" href="#/anchors">Numeric anchors</a>' +
    '</div>';
};

renderers['progress'] = function(){

  }).join('');
  var hist = Store.state.history.slice().reverse().map(function(h){
    var d = new Date(h.ts);
    var when = (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0'+d.getMinutes()).slice(-2);
    return '<tr><td>' + when + '</td><td>' + esc(h.mode) + '</td><td>' + h.score + '/' + h.total + ' (' + h.pct + '%)</td>' +
      '<td>' + (h.pass ? '<span style="color:var(--green);font-weight:700">PASS</span>' : '<span style="color:var(--red)">below</span>') + '</td>' +
      '<td>' + Math.floor(h.durSec/60) + 'm' + (h.durSec%60) + 's</td></tr>';
  }).join('');
  root.innerHTML =
    '<h1>Progress &amp; Data</h1>' +
    '<h2>Per-topic accuracy</h2>' +
    '<div class="table-wrap"><table><tr><th>Topic</th><th>Seen</th><th>Attempts</th><th>Accuracy</th><th></th></tr>' + rows + '</table></div>' +
    '<h2>Mock history</h2>' +
    (hist ? '<div class="table-wrap"><table><tr><th>When</th><th>Mode</th><th>Score</th><th>Result</th><th>Time</th></tr>' + hist + '</table></div>'
          : '<p style="color:var(--ink-soft)">No mocks taken yet.</p>') +
    '<h2>Move progress between devices</h2>' +
    '<p style="font-size:.9rem">Progress is saved per device/browser. To move it (e.g., laptop → iPhone), copy the export here and paste it into the import box on the other device. Also useful as a backup — Safari can clear site storage after long inactivity.</p>' +
    '<div class="btn-row"><button class="btn secondary" id="expBtn">Export progress</button></div>' +
    '<textarea class="io" id="ioBox" placeholder="Export appears here; or paste an export and press Import."></textarea>' +
    '<div class="btn-row"><button class="btn" id="impBtn">Import (replaces current progress)</button>' +
    '<button class="btn danger" id="resetBtn">Reset all progress</button></div>';

  document.getElementById('expBtn').addEventListener('click', function(){
    var box = document.getElementById('ioBox');
    box.value = Store.exportJSON();
    box.select();
    try { document.execCommand('copy'); toast('Progress copied to clipboard.'); }
    catch(e){ toast('Select the text and copy it manually.'); }
  });
  document.getElementById('impBtn').addEventListener('click', function(){
    var txt = document.getElementById('ioBox').value.trim();
    if (!txt) { toast('Paste an export first.'); return; }
    if (!confirm('Importing replaces ALL progress on this device. Continue?')) return;
    try { Store.importJSON(txt); toast('Progress imported.'); renderers['progress'](); }
    catch(e){ toast('Import failed: ' + e.message); }
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('Delete all progress (quiz stats, history, chapter completion)? This cannot be undone.')) return;
    Store.reset(); toast('Progress reset.'); renderers['progress']();
  });
};

/* --- chapter helpers --- */
function chapterTopics(ch){
  return Object.keys(TOPICS).filter(function(t){ return TOPICS[t].chapter === ch; });
}
function startChapterDrill(ch){
  var topics = chapterTopics(ch);
  var pool = QUESTIONS.filter(function(q){ return topics.indexOf(q.topic) !== -1; });
  if (!pool.length) { toast('No questions for this chapter yet.'); return; }
  startQuiz({mode:'drill', label:'Drill: Chapter ' + ch.replace('ch',''), items:pickWeak(pool, Math.min(10, pool.length)), instant:true});
}
function chapterFooter(ch){
  var done = Store.state.sections[ch] && Store.state.sections[ch].done;
  return '<div class="btn-row" style="margin-top:28px">' +
    '<button class="btn" data-chdrill="' + ch + '">Drill this chapter</button>' +
    '<button class="btn ' + (done ? 'ghost' : 'secondary') + '" data-chdone="' + ch + '">' + (done ? '✓ Marked as read — unmark' : 'Mark chapter as read') + '</button>' +
    '<a class="btn ghost" href="#/study">Chapter index</a></div>' +
    '<div class="foot-note">Digest based on the JAF “Rules of the Road” (2017 English edition) and exam-focused research. ' +
    'A few figures may have changed since 2017 — when an external question bank disagrees, trust the newer source.</div>';
}
function wireChapterFooter(root, rerender){
  root.querySelectorAll('[data-chdrill]').forEach(function(b){
    b.addEventListener('click', function(){ startChapterDrill(b.dataset.chdrill); });
  });
  root.querySelectorAll('[data-chdone]').forEach(function(b){
    b.addEventListener('click', function(){
      var ch = b.dataset.chdone;
      var cur = Store.state.sections[ch] && Store.state.sections[ch].done;
      Store.state.sections[ch] = {done:!cur, ts:Date.now()};
      Store.save();
      rerender();
    });
  });
}

      {s:'At a flashing red signal, vehicles must stop at the stop line before proceeding.', a:true, w:'Flashing red = stop, then proceed when safe. The duty is real; this one is true. Traps cut both ways — don\'t × every “must.”'}

function fig(svg, caption, scrollx){
  return '<figure class="figure" style="margin-left:0;margin-right:0">' +
    (scrollx ? '<div class="scrollx">' + svg + '</div>' : svg) +

function panel(svg, label, step){

}
/* signal head: lit = 'g'|'y'|'r'|null; flash dashes the lit lens; arrow draws a green arrow lens row */
function sigHead(lit, opts){
  opts = opts || {};
  function lens(cx, col, on, flash){
    var fills = {g:'#19a974', y:'#f2b705', r:'#d6342c'};
    var c = '<circle cx="' + cx + '" cy="22" r="13" fill="' + (on ? fills[col] : '#3a3a3a') + '"/>';
    if (on && flash) c += '<circle cx="' + cx + '" cy="22" r="17" fill="none" stroke="' + fills[col] + '" stroke-width="2" stroke-dasharray="4,4"/>';
    return c;
  }
  var arrowRow = '';
  var h = 44;
  if (opts.arrow) {
    h = 86;
    var acol = opts.arrow === 'yellow' ? '#f2b705' : '#19a974';
    var rot = opts.arrowDir === 'right' ? '' : (opts.arrowDir === 'up' ? ' transform="rotate(-90 62 64)"' : '');
    arrowRow = '<rect x="4" y="46" width="116" height="36" rx="6" fill="#202020"/>' +
      '<g' + rot + '><path d="M40 64 H76 M64 54 L80 64 L64 74" stroke="' + acol + '" stroke-width="6" fill="none"/></g>';
  }
  return '<svg viewBox="-6 -6 136 ' + (h + 12) + '" style="max-width:' + (opts.w || 120) + 'px">' +
    '<rect x="0" y="0" width="124" height="44" rx="8" fill="#202020"/>' +
    lens(24, 'g', lit === 'g', opts.flash) + lens(62, 'y', lit === 'y', opts.flash) + lens(100, 'r', lit === 'r', opts.flash) +
    arrowRow + '</svg>';
}
/* police officer figure: pose 'front'|'side'|'raisedFront'|'torch'
   viewBox 0 0 90 120. A recognizable peaked-cap officer in a blue uniform with
   white traffic gloves; each pose makes one gesture unambiguous on its own. */
function officerFig(pose){
  var NAVY='#1A50A2', DK='#16213e', SKIN='#e8c39e', GOLD='#F2B705', BRIM='#10182b';
  var night = (pose === 'torch');
  var uni = night ? '#1f2533' : NAVY;          // jacket / sleeves
  var skin = night ? '#cbb699' : SKIN;
  var trouser = night ? '#10141d' : DK;

  function sleeve(x1,y1,x2,y2){
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+uni+
           '" stroke-width="8.5" stroke-linecap="round"/>';
  }
  // white traffic glove, outlined so it reads on the white panel
  function glove(x,y){
    return '<circle cx="'+x+'" cy="'+y+'" r="5.6" fill="#fff" stroke="'+uni+'" stroke-width="1.7"/>';
  }
  var legs =
    '<path d="M32 91 L30 116 L40 116 L44 96 L48 116 L58 116 L56 91 Z" fill="'+trouser+'"/>' +
    '<ellipse cx="35" cy="116.5" rx="6.5" ry="2.6" fill="#0a0e1a"/>' +
    '<ellipse cx="53" cy="116.5" rx="6.5" ry="2.6" fill="#0a0e1a"/>';

  // frontal head: symmetric peaked cap, two eyes, centre cap badge
  var headFront =
    '<circle cx="45" cy="32" r="12.5" fill="'+skin+'"/>' +
    '<circle cx="32.5" cy="32" r="3" fill="'+skin+'"/><circle cx="57.5" cy="32" r="3" fill="'+skin+'"/>' +
    '<circle cx="40.5" cy="32" r="1.7" fill="#1d1d1f"/><circle cx="49.5" cy="32" r="1.7" fill="#1d1d1f"/>' +
    '<line x1="42" y1="38" x2="48" y2="38" stroke="#9a6b4f" stroke-width="1.2"/>' +
    '<ellipse cx="45" cy="25" rx="16.5" ry="4.5" fill="'+BRIM+'"/>' +          // visor
    '<rect x="29" y="15.5" width="32" height="8" rx="2" fill="'+NAVY+'"/>' +    // band
    '<rect x="29" y="21" width="32" height="1.8" fill="'+GOLD+'"/>' +
    '<path d="M29 17 Q45 1 61 17 Z" fill="'+NAVY+'"/>' +                        // crown
    '<circle cx="45" cy="18.5" r="2.6" fill="'+GOLD+'"/>';                      // badge
  // profile head: brim juts forward, one eye, a nose
  var headSide =
    '<circle cx="45" cy="32" r="12.5" fill="'+skin+'"/>' +
    '<path d="M57 30 l5 2.5 -5 2.5 z" fill="'+skin+'"/>' +                      // nose
    '<circle cx="51" cy="31" r="1.7" fill="#1d1d1f"/>' +                       // eye
    '<circle cx="39" cy="33" r="2.8" fill="'+skin+'"/>' +                      // back ear
    '<ellipse cx="55" cy="24" rx="13" ry="3.8" fill="'+BRIM+'" transform="rotate(-7 55 24)"/>' +
    '<rect x="33" y="15.5" width="25" height="8" rx="2" fill="'+NAVY+'"/>' +
    '<rect x="33" y="21" width="25" height="1.8" fill="'+GOLD+'"/>' +
    '<path d="M33 17 Q44 2 58 16 Z" fill="'+NAVY+'"/>' +
    '<circle cx="54" cy="18.5" r="2.4" fill="'+GOLD+'"/>';

  var torsoFront =
    '<rect x="41" y="42" width="8" height="7" fill="'+skin+'"/>' +             // neck
    '<path d="M27 60 Q45 47 63 60 L60 92 L30 92 Z" fill="'+uni+'"/>' +         // jacket
    '<path d="M45 49 L38 60 L45 64 L52 60 Z" fill="'+DK+'"/>' +                // collar V
    '<circle cx="45" cy="70" r="1.6" fill="'+GOLD+'"/><circle cx="45" cy="79" r="1.6" fill="'+GOLD+'"/>' +
    '<rect x="30" y="88" width="30" height="5" fill="'+DK+'"/>' +              // belt
    '<rect x="43" y="88" width="4" height="5" fill="'+GOLD+'"/>';             // buckle
  var torsoSide =
    '<rect x="42" y="42" width="7" height="7" fill="'+skin+'"/>' +
    '<path d="M38 58 Q54 56 51 80 L49 92 L36 92 L37 58 Z" fill="'+uni+'"/>' +  // chest forward
    '<rect x="36" y="88" width="15" height="5" fill="'+DK+'"/>' +
    '<rect x="46" y="88" width="4" height="5" fill="'+GOLD+'"/>';
  // rear view: back of the cap (no visor/badge), no face, nape hairline, jacket centre seam
  var headBack =
    '<circle cx="45" cy="32" r="12.5" fill="'+skin+'"/>' +
    '<circle cx="32.5" cy="32" r="3" fill="'+skin+'"/><circle cx="57.5" cy="32" r="3" fill="'+skin+'"/>' +
    '<path d="M34 39 Q45 45 56 39 L56 33 Q45 36 34 33 Z" fill="#3a2a1c"/>' +     // nape hair
    '<rect x="29" y="15.5" width="32" height="8" rx="2" fill="'+NAVY+'"/>' +      // cap band
    '<rect x="29" y="21" width="32" height="1.8" fill="'+GOLD+'"/>' +
    '<path d="M29 17 Q45 1 61 17 Z" fill="'+NAVY+'"/>' +                          // crown dome
    '<rect x="41" y="22" width="8" height="2.4" rx="1" fill="'+DK+'"/>';          // cap adjuster strap
  var torsoBack =
    '<rect x="41" y="42" width="8" height="7" fill="'+skin+'"/>' +               // nape
    '<path d="M27 60 Q45 47 63 60 L60 92 L30 92 Z" fill="'+uni+'"/>' +           // jacket
    '<path d="M39 50 Q45 54 51 50 L51 53 Q45 56 39 53 Z" fill="'+DK+'"/>' +      // back collar
    '<path d="M30 59 Q45 53 60 59" fill="none" stroke="#0f1b33" stroke-width="1.3"/>' + // shoulder yoke
    '<line x1="45" y1="55" x2="45" y2="88" stroke="#0f1b33" stroke-width="1.3"/>' +     // centre seam
    '<rect x="30" y="88" width="30" height="5" fill="'+DK+'"/>';                 // belt (no front buckle)

  var head, torso, arms;
  if (pose === 'side') {
    head = headSide; torso = torsoSide;
    // arms extend along the line of travel (front-to-back) = horizontal here
    arms = sleeve(45,57, 19,57) + sleeve(45,57, 71,57) + glove(17,57) + glove(73,57);
  } else if (pose === 'raisedFront') {
    head = headFront; torso = torsoFront;
    // one arm straight up beside the head, the other down at the side
    arms = sleeve(60,59, 61,16) + glove(61,13) +
           sleeve(31,60, 26,87) + glove(25,89);
  } else if (pose === 'torch') {
    head = headFront; torso = torsoFront;
    // one gloved hand swings a lit baton sideways; motion arc shows the sweep
    arms = sleeve(30,61, 25,87) + glove(24,89) +
           sleeve(60,61, 75,57) + glove(77,56) +
           '<path d="M68 66 Q84 56 93 40" fill="none" stroke="'+GOLD+
           '" stroke-width="2" stroke-dasharray="3 3" opacity=".85"/>' +
           '<line x1="77" y1="56" x2="90" y2="46" stroke="#C0272D" stroke-width="4.5" stroke-linecap="round"/>' +
           '<circle cx="91" cy="45" r="7" fill="'+GOLD+'" opacity=".45"/>' +
           '<circle cx="91" cy="45" r="3.4" fill="#ffd24d"/>';
  } else if (pose === 'back') {
    head = headBack; torso = torsoBack;
    arms = sleeve(30,61, 10,61) + sleeve(60,61, 80,61) + glove(8,61) + glove(82,61);
  } else { // front
    head = headFront; torso = torsoFront;
    arms = sleeve(30,61, 10,61) + sleeve(60,61, 80,61) + glove(8,61) + glove(82,61);
  }

  return '<svg viewBox="0 0 90 120" style="max-width:90px;margin:0 auto;display:block">' +
    (night ? '<rect x="0" y="0" width="90" height="120" fill="#0e1320" rx="4"/>' : '') +
    legs + torso + arms + head + '</svg>';
}
function nb(x, y, n, col){
  return '<circle cx="' + x + '" cy="' + y + '" r="11" fill="' + (col || '#1d1d1f') + '"/>' +
    '<text x="' + x + '" y="' + (y+4.5) + '" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">' + n + '</text>';
}
function lightChip(col, label){
  var fills = {g:'#19a974', y:'#f2b705', r:'#d6342c'};
  return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700">' +
    '<span style="width:13px;height:13px;border-radius:50%;background:' + fills[col] + ';display:inline-block"></span>' + label + '</span>';
}
/* side-profile car drawn around its ground-contact centre (local y=0), facing
   right by default. Yellow headlight + red tail-light show heading direction;
   pass faceLeft=true to mirror. For slope scenes: translate to the contact
   point, then rotate by the slope angle. */
function sideCar(color, win, faceLeft){
  var car =
    '<ellipse cx="0" cy="1" rx="30" ry="3.5" fill="rgba(0,0,0,.16)"/>' +
    '<circle cx="-18" cy="-7" r="7" fill="#222"/><circle cx="-18" cy="-7" r="3" fill="#9aa0a6"/>' +
    '<circle cx="18" cy="-7" r="7" fill="#222"/><circle cx="18" cy="-7" r="3" fill="#9aa0a6"/>' +
    '<path d="M-31 -10 L-31 -21 Q-31 -22.5 -29.5 -22.5 L-12 -22.5 L-6 -33 L10 -33 L19 -22 L30 -20.5 Q31 -20 31 -18.5 L31 -10 Z" fill="'+color+'" stroke="#222" stroke-width="1"/>' +
    '<path d="M-5 -31.5 L8.5 -31.5 L15 -23 L-5 -23 Z" fill="'+win+'"/>' +

    '<circle cx="-30.5" cy="-13" r="1.9" fill="#c0272d"/>';
  return faceLeft ? '<g transform="scale(-1,1)">' + car + '</g>' : car;
}
/* top-down (overhead) car for lane diagrams, centred at origin, heading LEFT
   (Japan drives on the left, so in an overhead view traffic runs right-to-left
   and the rightmost/passing lane is at the top). Yellow headlights + windshield
   lead at the front-left; red tail-lights at the rear-right. */
function topCar(color, win){
  return ''+
    '<rect x="-23" y="-11" width="46" height="22" rx="6" transform="translate(1.5,2)" fill="rgba(0,0,0,.14)"/>' +

    '<polygon points="-8,-9 -8,9 -13,6.5 -13,-6.5" fill="'+win+'"/>' +                                          // windshield (front)
    '<polygon points="12,-9 12,9 16,6.5 16,-6.5" fill="'+win+'"/>' +                                            // rear window
    '<rect x="-23" y="-10" width="4" height="4" rx="1" fill="#ffe27a"/><rect x="-23" y="6" width="4" height="4" rx="1" fill="#ffe27a"/>' +  // headlights
    '<rect x="19.5" y="-10" width="3.5" height="4" rx="1" fill="#c0272d"/><rect x="19.5" y="6" width="3.5" height="4" rx="1" fill="#c0272d"/>'; // tail-lights
}

renderers['study/ch2'] = function(){
  var root = document.getElementById('ch2Root');

  '<h1><span class="chapter-tab">2</span>Before Driving <span class="badge med">MED</span> <span class="badge stage">STAGE 1</span></h1>' +
  '<p>A short chapter, but it owns several <strong>guaranteed-number questions</strong>: belts, child seats, alcohol, loading, and what your license lets you drive.</p>' +

  '<h2>Licenses</h2>' +
  '<ul>' +
  '<li>A <strong>regular (普通) license</strong> covers regular cars, light motor vehicles… and <strong>mopeds (原付)</strong> and small special vehicles. It does NOT cover motorcycles (50cc+).</li>' +
  '<li><strong>Provisional (karimen) practice</strong>: only on ordinary roads, with an instructor or a person licensed for 3+ years on the front passenger seat, and the 仮免許練習中 plates on front and rear.</li>' +
  '<li>Carrying your license while driving is mandatory; lending the car to an unlicensed person is a crime for both.</li>' +
  '</ul>' +

  '<h2>Condition to drive</h2>' +
  '<ul>' +
  '<li><strong>Alcohol: zero is the rule.</strong> Any alcohol = do not drive. The punishable breath threshold is <span class="num">0.15 mg/L</span>, but “under the limit so it\'s legal to drive after one beer” is always ×.</li>' +
  '<li>Liability spreads: the <strong>provider of the car, the provider of alcohol, and passengers</strong> who knew can all be punished.</li>' +
  '<li>No driving when overtired or on medicine that impairs you. Smartphone/screen use while driving is prohibited (holding a phone even while waiting at a light is bait — the vehicle is still “in operation”… but stopped at a light it is actually <em>not</em> punishable driving use; the safe exam answer follows the statement\'s wording about “while driving”).</li>' +
  '</ul>' +

  '<h2>Belts, child seats, helmets</h2>' +
  '<ul>' +
  '<li><strong>Seatbelts: all seats</strong>, rear included. The driver is responsible for making passengers wear them.</li>' +
  '<li><strong>Child seat: required under 6 years old.</strong> An adult holding the child is never a substitute.</li>' +
  '<li>Motorcycles/mopeds: helmet always, properly fastened.</li>' +
  '</ul>' +

  '<ul>' +

    '<circle cx="58" cy="100" r="11" fill="#1d1d1f"/><circle cx="158" cy="100" r="11" fill="#1d1d1f"/>' +

    '<text x="232" y="42" font-size="13" font-weight="bold" fill="#C0272D">≤1.2×</text>' +

  panel('<svg viewBox="0 0 260 120">' +

      return '<circle cx="' + x + '" cy="38" r="8" fill="#1A50A2"/><line x1="' + x + '" y1="46" x2="' + x + '" y2="68" stroke="#1A50A2" stroke-width="4"/><line x1="' + (x-8) + '" y1="56" x2="' + (x+8) + '" y2="56" stroke="#1A50A2" stroke-width="3"/><line x1="' + x + '" y1="68" x2="' + (x-6) + '" y2="84" stroke="#1A50A2" stroke-width="3"/><line x1="' + x + '" y1="68" x2="' + (x+6) + '" y2="84" stroke="#1A50A2" stroke-width="3"/>';

      return '<circle cx="' + x + '" cy="28" r="10" fill="#0e7a5f"/><line x1="' + x + '" y1="38" x2="' + x + '" y2="70" stroke="#0e7a5f" stroke-width="5"/><line x1="' + (x-11) + '" y1="52" x2="' + (x+11) + '" y2="52" stroke="#0e7a5f" stroke-width="4"/><line x1="' + x + '" y1="70" x2="' + (x-8) + '" y2="92" stroke="#0e7a5f" stroke-width="4"/><line x1="' + x + '" y1="70" x2="' + (x+8) + '" y2="92" stroke="#0e7a5f" stroke-width="4"/>';

  '</div>' +

  '<h2>Vehicle checks</h2>' +

renderers['study/ch3'] = function(){
  var root = document.getElementById('ch3Root');
  root.innerHTML =
  '<h1><span class="chapter-tab">3</span>Driving Tips <span class="badge high">HIGH</span> <span class="badge stage">STAGE 1</span></h1>' +
  '<p>The exam\'s center of gravity: right-of-way, speed and stopping, overtaking, parking distances, pedestrian protection, and 徐行. Expect a third of the karimen to come from here.</p>' +

  '<h2>Keep left, lanes</h2>' +
  '<ul>' +
  '<li>Vehicles keep <strong>left</strong>; on multi-lane roads the rightmost lane is for passing — cruising in it is a violation.</li>' +

    /* lane change with clock */
    '<g transform="rotate(90 60 115)"><use href="#hz-you" x="60" y="115"/></g>' +

    '<circle cx="60" cy="22" r="14" fill="#fff" stroke="#1A50A2" stroke-width="2.5"/><line x1="60" y1="22" x2="60" y2="13" stroke="#1A50A2" stroke-width="2.5"/><line x1="60" y1="22" x2="67" y2="25" stroke="#1A50A2" stroke-width="2.5"/>' +
    '<text x="84" y="27" font-size="15" font-weight="bold" fill="#1A50A2">lane change: 3 s before</text>' +

    '<g transform="rotate(90 320 65)"><use href="#hz-car" x="320" y="65"/></g>' +
    '<path d="M346 65 H520 Q535 65 535 80 V120" stroke="#1d1d1f" stroke-width="2.5" fill="none" stroke-dasharray="6,5"/>' +

    '<path d="M390 152 V160 H540 V152" stroke="#C0272D" stroke-width="2.5" fill="none"/>' +

    'The classic number-swap pair, side by side: lane change = <strong>3 seconds</strong> (a time), turn at an intersection = <strong>30 meters</strong> (a distance).') +

  '<h2>Right-of-way at uncontrolled intersections</h2>' +
  '<div class="card accent"><ul style="margin:.3em 0">' +
  '<li>Equal-width roads: <strong>yield to traffic from your LEFT</strong> (and always to streetcars).</li>' +
  '<li>Clearly <strong>wider road has priority</strong>; from a narrow road, slow down and yield.</li>' +
  '<li><strong>Priority road</strong> (marked 優先道路): yield to it regardless of width.</li>' +
  '<li>Turning right? Oncoming straight-ahead and left-turning traffic goes first — <em>even if you entered the intersection first</em>.</li>' +

  '<div class="fig-grid">' +
  panel('<svg viewBox="0 0 200 170">' +

  panel('<svg viewBox="0 0 200 170">' +
    '<rect width="200" height="170" fill="#f1ede4"/>' +

    '<use href="#hz-you" x="100" y="142"/>' +

  '</div>' +
  '<p>Note: some English study materials say “yield to the right” — that is wrong for Japan. The law (Art. 36) says give way to vehicles approaching <strong>from the left</strong>.</p>' +

  '<h2>Speed, stopping distance, following distance</h2>' +

        '<rect x="' + (x0+rw) + '" y="' + y + '" width="' + bw + '" height="27" fill="#C0272D"/>' +
        '<text x="' + (x0+rw+bw+8) + '" y="' + (y+19) + '" font-size="15" font-weight="bold" fill="#1d1d1f">≈ ' + (r[1]+r[2]) + ' m</text>';
    }).join('') +
    '</svg>',
    'Double the speed ≈ <strong>four times</strong> the braking distance (red). On wet roads the red part roughly doubles again. Exact meters aren\'t tested — the squared growth and the reaction+braking split are.') +
  '<ul>' +
  '<li>No sign = <span class="num">60 km/h</span> max for cars on ordinary roads. Posted limits bind all vehicles <em>at or below</em> the sign.</li>' +
  '<li><strong>Stopping distance = free-running distance</strong> (during reaction, ~1 s) <strong>+ braking distance</strong>. Braking distance grows with the <em>square</em> of speed; on wet roads it stretches further.</li>' +

  '<h2>徐行 (slow-driving) — the places you MUST crawl</h2>' +

  '<li>Headlights at night and in <strong>tunnels</strong>; also when visibility is under <span class="num">50 m</span> (fog, heavy rain, snow).</li>' +

renderers['study/ch6'] = function(){

/* ===== 07 QUIZ ENGINE ===== */
function qstat(id){ return Store.state.q[id] || {a:0,c:0,streak:0,last:0,lastCorrect:false}; }
function recordAnswer(id, correct){
  var s = qstat(id);
  s.a += 1;
  if (correct) { s.c += 1; s.streak += 1; } else { s.streak = 0; }
  s.last = Date.now();
  s.lastCorrect = correct;
  Store.state.q[id] = s;
  var wq = Store.state.wrongQueue;
  var pos = wq.indexOf(id);
  if (!correct && pos === -1) wq.push(id);
  if (correct && pos !== -1 && s.streak >= 2) wq.splice(pos, 1);
  Store.save();
}
/* weighted pick: prefer least-recently-seen (mocks) or weakest (drills) */
function pickLRS(pool, n){
  var sorted = pool.slice().sort(function(a,b){
    return (qstat(a.id).last + Math.random()*8.64e7) - (qstat(b.id).last + Math.random()*8.64e7);
  });
  return shuffle(sorted.slice(0, n));
}
function pickWeak(pool, n){
  var sorted = pool.slice().sort(function(a,b){
    var sa = qstat(a.id), sb = qstat(b.id);
    var ra = sa.a ? sa.c/sa.a : -1, rb = sb.a ? sb.c/sb.a : -1; // unseen first
    return (ra + Math.random()*0.3) - (rb + Math.random()*0.3);
  });
  return shuffle(sorted.slice(0, n));
}

var Quiz = {
  active:false, run:null,
  abandon:function(){
    Quiz.active = false; Quiz.run = null;
    document.body.classList.remove('quiz-active');
    if (Quiz._timerInt) { clearInterval(Quiz._timerInt); Quiz._timerInt = null; }
  },
  _timerInt:null
};

function startQuiz(opts){
  // opts: {mode,label,items,hazardItems,instant,minutes,ptsPer,passPct}
  Quiz.active = true;
  Quiz.run = {
    mode: opts.mode, label: opts.label,
    items: opts.items, hazard: opts.hazardItems || [],
    instant: !!opts.instant,
    idx: 0,
    answers: new Array(opts.items.length).fill(null),
    hazardAnswers: (opts.hazardItems || []).map(function(){ return [null,null,null]; }),
    flags: {},
    answered: false, // instant-mode: current question answered & showing explanation
    startTs: Date.now(),
    deadline: opts.minutes ? Date.now() + opts.minutes*60000 : null,
    ptsPer: opts.ptsPer || 1,
    passPct: opts.passPct || 90
  };
  document.body.classList.add('quiz-active');
  if (Quiz._timerInt) clearInterval(Quiz._timerInt);
  if (Quiz.run.deadline) {
    Quiz._timerInt = setInterval(function(){
      var el = document.getElementById('timerChip');
      if (!Quiz.active || !Quiz.run || !Quiz.run.deadline) return;
      var left = Quiz.run.deadline - Date.now();
      if (left <= 0) { finishQuiz(); toast('Time is up — submitted automatically.'); return; }
      if (el) {
        var m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
        el.textContent = m + ':' + (s<10?'0':'') + s;
        el.classList.toggle('low', left < 5*60000);
      }
    }, 500);
  }
  navigate('quiz');
  renderQuizRunner();
}

function totalScreens(run){ return run.items.length + run.hazard.length; }

function renderQuizRunner(){
  var run = Quiz.run;
  var root = document.getElementById('quizRoot');
  var total = totalScreens(run);
  var i = run.idx;
  var isHazard = i >= run.items.length;
  var pct = Math.round(((i) / total) * 100);
  var timerHtml = run.deadline ? '<span class="timer-chip" id="timerChip">–:––</span>' : '';
  var head =
    '<div class="quiz-shell">' +
    '<div class="quiz-meta"><strong>' + esc(run.label) + '</strong>' +
    '<span>Q ' + (i+1) + ' / ' + total + '</span>' + timerHtml + '</div>' +
    '<div class="quiz-progressbar"><div style="width:' + pct + '%"></div></div>';

  if (isHazard) {
    root.innerHTML = head + renderHazardScreen(run, i - run.items.length) + '</div>';
  } else {
    var q = run.items[i];
    var picked = run.answers[i];
    var body =
      '<div class="q-statement">' + esc(q.statement) + '</div>' +
      '<div class="ox-sticky">' +
      '<div class="ox-bar">' +
        '<button class="o-btn' + (picked===true ?' picked':'') + '" data-ans="true" ' + (run.answered?'disabled':'') + '>○<div style="font-size:.65rem;font-weight:600">TRUE / correct</div></button>' +
        '<button class="x-btn' + (picked===false?' picked':'') + '" data-ans="false" ' + (run.answered?'disabled':'') + '>×<div style="font-size:.65rem;font-weight:600">FALSE / wrong</div></button>' +
      '</div>' +
      '<div class="ox-hint">Keys: O / → = ○ · X / ← = × · Enter = next</div>' +
      '</div>' +
      '<div id="feedback"></div>' +
      '<div class="btn-row" id="quizNav"></div>';
    root.innerHTML = head + body + '</div>';
    if (run.answered) showFeedback(q, picked);
    renderQuizNavButtons();
    root.querySelectorAll('.ox-bar button').forEach(function(b){
      b.addEventListener('click', function(){ answerCurrent(b.dataset.ans === 'true'); });
    });
  }
}

function renderQuizNavButtons(){
  var run = Quiz.run;
  var nav = document.getElementById('quizNav');
  if (!nav) return;
  var i = run.idx, total = totalScreens(run);
  var html = '';
  if (run.instant) {
    if (run.answered) {
      html += '<button class="btn" data-act="next">' + (i+1 >= total ? 'Finish' : 'Next →') + '</button>';
    }
    html += '<button class="btn ghost small" data-act="quit">End drill</button>';
  } else {
    if (i > 0) html += '<button class="btn secondary" data-act="back">← Back</button>';
    if (run.answers[i] !== null && i+1 < total) html += '<button class="btn" data-act="next">Next →</button>';
    html += '<button class="btn ghost small" data-act="flag">' + (run.flags[i] ? '⚑ Flagged' : 'Flag for review') + '</button>';
    if (i+1 >= total || Object.keys(run.flags).length || run.answers.indexOf(null) === -1) {
      html += '<button class="btn danger" data-act="submit">Submit answers</button>';
    }
  }
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ quizNavAction(b.dataset.act); });
  });
}

function quizNavAction(act){
  var run = Quiz.run;
  if (act === 'next') {
    if (run.idx + 1 >= totalScreens(run)) { finishQuiz(); return; }
    run.idx += 1; run.answered = false; renderQuizRunner(); window.scrollTo(0,0);
  } else if (act === 'back') {
    if (run.idx > 0) { run.idx -= 1; renderQuizRunner(); }
  } else if (act === 'flag') {
    if (run.flags[run.idx]) delete run.flags[run.idx]; else run.flags[run.idx] = true;
    renderQuizNavButtons();
  } else if (act === 'submit') {
    var blank = run.answers.filter(function(a){ return a === null; }).length;
    run.hazardAnswers.forEach(function(h){ h.forEach(function(p){ if (p === null) blank++; }); });
    if (blank > 0 && !confirm(blank + ' unanswered item(s) will count as wrong. Submit anyway?')) return;
    finishQuiz();
  } else if (act === 'quit') {
    finishQuiz();
  }
}

function answerCurrent(val){
  var run = Quiz.run;
  if (!run || run.idx >= run.items.length) return;
  if (run.instant && run.answered) return;
  var q = run.items[run.idx];
  run.answers[run.idx] = val;
  if (run.instant) {
    run.answered = true;
    var correct = (val === q.answer);
    recordAnswer(q.id, correct);
    renderQuizRunner();
  } else {
    // exam mode: silent advance
    if (run.idx + 1 < totalScreens(run)) { run.idx += 1; renderQuizRunner(); window.scrollTo(0,0); }
    else renderQuizRunner(); // last question: stay, show submit
  }
}

function showFeedback(q, picked){
  var fb = document.getElementById('feedback');
  if (!fb) return;
  var correct = (picked === q.answer);
  var trap = q.trapType ? '<div class="trap-tag"><span class="badge trap">⚠ ' + esc(TRAPS[q.trapType].label) + '</span></div>' : '';
  fb.innerHTML =
    '<div class="verdict ' + (correct?'correct':'wrong') + '">' + (correct ? '○ Correct' : '× Wrong — the answer is ' + (q.answer ? '○ (true)' : '× (false)')) + '</div>' +
    '<div class="explain">' + trap + esc(q.explanation) + '</div>';
}

/* --- finishing & results --- */
function finishQuiz(){
  var run = Quiz.run;
  if (!run) return;
  if (Quiz._timerInt) { clearInterval(Quiz._timerInt); Quiz._timerInt = null; }
  var durSec = Math.round((Date.now() - run.startTs)/1000);

  var byTopic = {}, byTrap = {};
  function bump(map, key, correct){
    if (!map[key]) map[key] = [0,0];
    map[key][1] += 1;
    if (correct) map[key][0] += 1;
  }
  var pts = 0, totalPts = 0;
  var reviewRows = [];
  run.items.forEach(function(q, i){
    var picked = run.answers[i];
    var correct = (picked === q.answer);
    totalPts += run.ptsPer;
    if (correct) pts += run.ptsPer;
    bump(byTopic, q.topic, correct);
    if (q.trapType) bump(byTrap, q.trapType, correct);
    if (!run.instant) recordAnswer(q.id, correct);
    reviewRows.push({q:q, picked:picked, correct:correct});
  });
  var hazardRows = [];
  run.hazard.forEach(function(h, hi){
    totalPts += 2;
    var ans = run.hazardAnswers[hi];
    var allOk = h.parts.every(function(p, pi){ return ans[pi] === p.answer; });
    if (allOk) pts += 2;
    bump(byTopic, h.topic, allOk);
    recordAnswer(h.id, allOk);
    hazardRows.push({h:h, ans:ans, correct:allOk});
  });

  var pctScore = totalPts ? Math.round(pts/totalPts*100) : 0;
  var pass = pctScore >= run.passPct;
  var isMock = !run.instant;
  if (isMock) {
    Store.state.history.push({
      mode: run.mode, ts: Date.now(), score: pts, total: totalPts, pct: pctScore,
      pass: pass, byTopic: byTopic, byTrap: byTrap, durSec: durSec
    });
    Store.state.history = Store.state.history.slice(-40);
    Store.save();
  }
  Quiz.active = false;
  document.body.classList.remove('quiz-active');
  renderResults({run:run, pts:pts, totalPts:totalPts, pct:pctScore, pass:pass,
                 byTopic:byTopic, byTrap:byTrap, reviewRows:reviewRows, hazardRows:hazardRows, durSec:durSec});
  Quiz.run = null;
}

function minibarRow(name, pair, weakLink){
  var pct = pair[1] ? Math.round(pair[0]/pair[1]*100) : 0;
  var weak = pct < 80;
  return '<div class="minibar' + (weak?' weak':'') + '">' +
    '<span class="nm">' + esc(name) + '</span>' +
    '<span class="track"><i style="width:' + pct + '%"></i></span>' +
    '<span class="pct">' + pct + '%</span>' +
    (weak && weakLink ? '<a class="btn small secondary" href="' + weakLink + '">Drill</a>' : '') +
    '</div>';
}

function renderResults(res){
  var root = document.getElementById('quizRoot');
  var run = res.run;
  var needPts = Math.ceil(run.passPct/100 * res.totalPts);
  var verdictLine = res.pass
    ? 'PASS at the real exam standard (' + run.passPct + '%).'
    : 'Below the ' + needPts + '/' + res.totalPts + ' bar — ' + Math.ceil((needPts - res.pts)/run.ptsPer) + ' more correct needed.';
  var topicBars = Object.keys(res.byTopic).map(function(t){
    return minibarRow(TOPICS[t] ? TOPICS[t].label : t, res.byTopic[t], '#/quiz/drill/' + t);
  }).join('');
  var trapBars = Object.keys(res.byTrap).map(function(t){
    return minibarRow(TRAPS[t].label, res.byTrap[t], '#/quiz/trap/' + t);
  }).join('');
  var wrongCount = res.reviewRows.filter(function(r){ return !r.correct; }).length;

  var reviewHtml = res.reviewRows.map(function(r, i){
    var pickedTxt = r.picked === null ? '—' : (r.picked ? '○' : '×');
    var trap = r.q.trapType ? ' <span class="badge trap">' + esc(TRAPS[r.q.trapType].label) + '</span>' : '';
    return '<div class="review-item ' + (r.correct?'right':'wrong') + '" data-wrong="' + (!r.correct) + '">' +
      '<div class="ri-head"><strong>Q' + (i+1) + '</strong><span>your answer: ' + pickedTxt +
      ' · correct: ' + (r.q.answer ? '○' : '×') + '</span>' + trap + '</div>' +
      '<div>' + esc(r.q.statement) + '</div>' +
      '<div style="color:var(--ink-soft);margin-top:4px">' + esc(r.q.explanation) + '</div></div>';
  }).join('');
  var hazardHtml = res.hazardRows.map(function(r, i){
    var parts = r.h.parts.map(function(p, pi){
      var ok = r.ans[pi] === p.answer;
      return '<div style="margin:6px 0;' + (ok?'':'color:var(--red)') + '">' + (ok ? '○' : '×') + ' ' + esc(p.statement) +
        '<div style="color:var(--ink-soft)">' + esc(p.explanation) + '</div></div>';
    }).join('');
    return '<div class="review-item ' + (r.correct?'right':'wrong') + '">' +
      '<div class="ri-head"><strong>Hazard ' + (i+1) + '</strong><span>' + (r.correct ? '2 / 2 pts' : '0 / 2 pts (all 3 must be correct)') + '</span></div>' +
      parts + '</div>';
  }).join('');

  root.innerHTML =
    '<h1>Result — ' + esc(run.label) + '</h1>' +
    '<div class="result-score">' + res.pts + ' / ' + res.totalPts + ' pts (' + res.pct + '%)</div>' +
    '<div class="' + (res.pass ? 'card ok' : 'card warn') + '"><strong>' + verdictLine + '</strong></div>' +
    '<div class="passline"><div class="fill' + (res.pass?' pass':'') + '" style="width:' + res.pct + '%"></div>' +
    '<div class="mark" style="left:' + run.passPct + '%"><span>' + run.passPct + '% pass line</span></div></div>' +
    (topicBars ? '<h2>By topic</h2>' + topicBars : '') +
    (trapBars ? '<h2>By trap type</h2><p style="font-size:.88rem;color:var(--ink-soft)">If one trap type stays red across quizzes, re-drill that pattern — don’t re-read whole chapters.</p>' + trapBars : '') +
    '<div class="btn-row">' +
      (wrongCount ? '<button class="btn" id="retryWrong">Retry the ' + wrongCount + ' wrong</button>' : '') +
      '<a class="btn secondary" href="#/quiz">Quiz Center</a>' +
      '<a class="btn ghost" href="#/home">Dashboard</a>' +
      (wrongCount ? '<button class="btn ghost small" id="toggleWrong">Show wrong only</button>' : '') +
    '</div>' +
    '<h2>Answer review</h2><div id="reviewList">' + reviewHtml + hazardHtml + '</div>';

  var retry = document.getElementById('retryWrong');
  if (retry) retry.addEventListener('click', function(){
    var wrongQs = res.reviewRows.filter(function(r){ return !r.correct; }).map(function(r){ return r.q; });
    startQuiz({mode:'retry', label:'Retry wrong answers', items:shuffle(wrongQs), instant:true});
  });
  var tog = document.getElementById('toggleWrong');
  if (tog) tog.addEventListener('click', function(){
    var showingAll = tog.dataset.on !== '1';
    document.querySelectorAll('#reviewList .review-item.right').forEach(function(el){ el.style.display = showingAll ? 'none' : ''; });
    tog.dataset.on = showingAll ? '1' : '0';
    tog.textContent = showingAll ? 'Show all' : 'Show wrong only';
  });
  window.scrollTo(0,0);
}

/* --- hazard screens (engine side; scenes arrive with HAZARD_QUESTIONS) --- */
function renderHazardScreen(run, hi){
  var h = run.hazard[hi];
  var ans = run.hazardAnswers[hi];
  var partsHtml = h.parts.map(function(p, pi){
    var a = ans[pi];
    return '<div class="card" style="margin:8px 0">' +
      '<div style="font-size:.95rem">(' + (pi+1) + ') ' + esc(p.statement) + '</div>' +
      '<div class="ox-bar" style="margin-top:8px;max-width:280px">' +
      '<button class="o-btn' + (a===true ?' picked':'') + '" style="min-height:44px;font-size:1.3rem" data-hz="' + pi + '" data-ans="true">○</button>' +
      '<button class="x-btn' + (a===false?' picked':'') + '" style="min-height:44px;font-size:1.3rem" data-hz="' + pi + '" data-ans="false">×</button>' +
      '</div></div>';
  }).join('');
  setTimeout(function(){
    document.querySelectorAll('[data-hz]').forEach(function(b){
      b.addEventListener('click', function(){
        ans[parseInt(b.dataset.hz,10)] = (b.dataset.ans === 'true');
        renderQuizRunner();
      });
    });
    renderQuizNavButtons();
  }, 0);
  var svg = h.sceneSvg ? '<svg viewBox="0 0 400 240" style="width:100%;max-width:440px;border:1px solid var(--line-strong);background:#fff;display:block"><use href="#' + h.sceneSvg + '"></use></svg>' : '';
  return '<div class="callout"><span class="lbl">Hazard prediction · 2 pts, all 3 parts must be correct</span>' + esc(h.sceneText) + '</div>' +
    svg + partsHtml +
    '<div class="btn-row" id="quizNav"></div>';
}

/* keyboard */
document.addEventListener('keydown', function(e){
  if (!Quiz.active || !Quiz.run) return;
  if (e.target && /TEXTAREA|INPUT/.test(e.target.tagName)) return;
  var k = e.key.toLowerCase();
  if (Quiz.run.idx < Quiz.run.items.length) {
    if (k === 'o' || k === 'arrowright') { answerCurrent(true); e.preventDefault(); }
    else if (k === 'x' || k === 'arrowleft') { answerCurrent(false); e.preventDefault(); }
  }
  if (k === 'enter' || k === ' ') {
    var run = Quiz.run;
    if (run.instant && run.answered) { quizNavAction('next'); e.preventDefault(); }
    else if (!run.instant && run.answers[run.idx] !== null) { quizNavAction('next'); e.preventDefault(); }
  }
});

/* --- quiz picker + param routes --- */
function lastMock(mode){
  var hs = Store.state.history.filter(function(h){ return h.mode === mode; });
  return hs.length ? hs[hs.length-1] : null;
}
function startMode(mode, param){
  var s1 = QUESTIONS.filter(function(q){ return q.stage === 1; });
  var all = QUESTIONS;
  if (mode === 'karimen') {
    startQuiz({mode:'karimen', label:'Karimen mock', items:pickLRS(s1, EXAMS.karimen.count),
               minutes:Store.state.settings.timer ? EXAMS.karimen.minutes : null, ptsPer:2, passPct:90});
  } else if (mode === 'honmen') {
    startQuiz({mode:'honmen', label:'Honmen set (half-length)', items:pickLRS(all, EXAMS.honmen.count),
               hazardItems:shuffle(HAZARD_QUESTIONS).slice(0, EXAMS.honmen.hazardCount),
               minutes:Store.state.settings.timer ? EXAMS.honmen.minutes : null, ptsPer:1, passPct:90});
  } else if (mode === 'honmenFull') {
    startQuiz({mode:'honmenFull', label:'Full honmen (90+5)', items:pickLRS(all, EXAMS.honmenFull.count),
               hazardItems:shuffle(HAZARD_QUESTIONS).slice(0, EXAMS.honmenFull.hazardCount),
               minutes:Store.state.settings.timer ? EXAMS.honmenFull.minutes : null, ptsPer:1, passPct:90});
  } else if (mode === 'drill') {
    var pool = param ? QUESTIONS.filter(function(q){ return q.topic === param; }) : QUESTIONS;
    if (!pool.length) { toast('No questions for that topic yet.'); return; }
    var lbl = param && TOPICS[param] ? 'Drill: ' + TOPICS[param].label : 'Mixed drill';
    startQuiz({mode:'drill', label:lbl, items:pickWeak(pool, Math.min(10, pool.length)), instant:true});
  } else if (mode === 'trap') {
    var tpool = QUESTIONS.filter(function(q){ return q.trapType === param; });
    if (!tpool.length) { toast('No questions for that trap type yet.'); return; }
    startQuiz({mode:'trap', label:'Trap drill: ' + TRAPS[param].label, items:pickWeak(tpool, Math.min(10, tpool.length)), instant:true});
  } else if (mode === 'review') {
    var ids = Store.state.wrongQueue.slice(0, 20);
    var rpool = ids.map(function(id){
      return QUESTIONS.filter(function(q){ return q.id === id; })[0];
    }).filter(Boolean);
    if (!rpool.length) { toast('Review queue is empty — nothing to review!'); return; }
    startQuiz({mode:'review', label:'Review queue (' + rpool.length + ')', items:rpool, instant:true});
  }
}

renderers['quiz'] = function(params){
  if (Quiz.active && Quiz.run) { renderQuizRunner(); return; }
  if (params && params.length) {
    // #/quiz/drill/<topic>, #/quiz/trap/<type>, #/quiz/mode/<mode>
    var kind = params[0], arg = params[1];
    if (kind === 'drill' || kind === 'trap') { startMode(kind, arg); return; }
    if (kind === 'mode') { startMode(arg); return; }
  }
  renderQuizPicker();
};

function renderQuizPicker(){
  var root = document.getElementById('quizRoot');
  var wq = Store.state.wrongQueue.length;
  function lastTxt(mode){
    var h = lastMock(mode);
    return h ? 'Last: ' + h.pct + '% ' + (h.pass ? '(pass)' : '(below bar)') : 'Not taken yet';
  }
  var s1count = QUESTIONS.filter(function(q){ return q.stage===1; }).length;
  var topicOpts = Object.keys(TOPICS).map(function(t){
    var n = QUESTIONS.filter(function(q){ return q.topic === t; }).length;
    return '<option value="' + t + '">' + TOPICS[t].label + ' (' + n + ')</option>';
  }).join('');
  var trapOpts = Object.keys(TRAPS).map(function(t){
    var n = QUESTIONS.filter(function(q){ return q.trapType === t; }).length;
    return '<option value="' + t + '">' + TRAPS[t].label + ' (' + n + ')</option>';
  }).join('');
  root.innerHTML =
    '<h1>Quiz Center</h1>' +
    '<p>Real exam standard is <strong>90%</strong>. Drill with instant feedback to learn; take mocks under exam conditions to measure.</p>' +
    '<div class="mode-grid">' +
    '<div class="mode-card"><h3>Karimen mock</h3><div class="desc">50 true/false from Stage 1 (' + s1count + ' in pool) · 2 pts each · pass 90/100 · 30-min timer.</div>' +
      '<div class="last">' + lastTxt('karimen') + '</div><button class="btn" data-start="karimen">Start mock</button></div>' +
    '<div class="mode-card"><h3>Honmen set</h3><div class="desc">45 text questions (Stage 1+2) + ' + EXAMS.honmen.hazardCount + ' hazard scenarios · pass 90% · 25-min timer. Half-length by design.</div>' +
      '<div class="last">' + lastTxt('honmen') + '</div><button class="btn" data-start="honmen">Start set</button></div>' +
    '<div class="mode-card"><h3>Full honmen (90+5)</h3><div class="desc">Full-length, 50-min timer. Note: uses nearly the whole pool — scores inflate if repeated.</div>' +
      '<div class="last">' + lastTxt('honmenFull') + '</div><button class="btn secondary" data-start="honmenFull">Start full</button></div>' +
    '<div class="mode-card"><h3>Review queue</h3><div class="desc">Re-answer everything you have gotten wrong. Two correct answers in a row clears a question.</div>' +
      '<div class="last">' + wq + ' in queue</div><button class="btn' + (wq ? '' : ' ghost') + '" data-start="review">Review wrong answers</button></div>' +
    '</div>' +
    '<h2>Topic drill</h2>' +
    '<div class="btn-row"><select id="topicSel" style="font-size:16px;padding:8px;border:1px solid var(--line-strong);background:#fff;max-width:70%">' + topicOpts + '</select>' +
    '<button class="btn" id="startTopic">Drill 10</button></div>' +
    '<h2>Trap drill</h2>' +
    '<div class="btn-row"><select id="trapSel" style="font-size:16px;padding:8px;border:1px solid var(--line-strong);background:#fff;max-width:70%">' + trapOpts + '</select>' +
    '<button class="btn" id="startTrap">Drill 10</button></div>' +
    '<label style="display:block;margin-top:18px;font-size:.9rem"><input type="checkbox" id="timerTog" ' + (Store.state.settings.timer?'checked':'') + '> Use exam timers on mocks</label>';

  root.querySelectorAll('[data-start]').forEach(function(b){
    b.addEventListener('click', function(){ startMode(b.dataset.start); });
  });
  document.getElementById('startTopic').addEventListener('click', function(){
    startMode('drill', document.getElementById('topicSel').value);
  });
  document.getElementById('startTrap').addEventListener('click', function(){
    startMode('trap', document.getElementById('trapSel').value);
  });
  document.getElementById('timerTog').addEventListener('change', function(e){
    Store.state.settings.timer = e.target.checked; Store.save();
  });
}

/* ===== 08 BOOT ===== */
function validateData(){
  var errs = [], counts = {};
  var ids = {};
  QUESTIONS.forEach(function(q){
    if (ids[q.id]) errs.push('duplicate id ' + q.id);
    ids[q.id] = 1;
    if (!TOPICS[q.topic]) errs.push(q.id + ': unknown topic ' + q.topic);
    if (q.stage !== 1 && q.stage !== 2) errs.push(q.id + ': bad stage');
    if (typeof q.answer !== 'boolean') errs.push(q.id + ': answer must be boolean');
    if (!q.statement || !q.explanation) errs.push(q.id + ': missing statement/explanation');
    if (q.trapType && !TRAPS[q.trapType]) errs.push(q.id + ': unknown trapType ' + q.trapType);
    counts[q.topic] = (counts[q.topic] || 0) + 1;
  });
  HAZARD_QUESTIONS.forEach(function(h){
    if (ids[h.id]) errs.push('duplicate id ' + h.id);
    ids[h.id] = 1;
    if (!h.parts || h.parts.length !== 3) errs.push(h.id + ': hazard needs exactly 3 parts');
  });
  var s1 = QUESTIONS.filter(function(q){ return q.stage === 1; }).length;
  console.log('[JDL] questions:', QUESTIONS.length, '(stage1:', s1 + ')', 'hazard:', HAZARD_QUESTIONS.length);
  console.log('[JDL] per-topic:', counts);
  if (errs.length) console.error('[JDL] DATA ERRORS:', errs);
  else console.log('[JDL] data validation passed');
}

buildNav();
Store.load();
validateData();
dispatch();

})();
</script>
